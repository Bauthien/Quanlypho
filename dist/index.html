<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quán Phở Việt - Thực Đơn & Đặt Món</title>
    <!-- Icon FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- File CSS -->
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>

    <!-- Thanh Navigation/Header -->
    <header class="navbar">
        <div class="nav-container">
            <div class="logo">
                <i class="fa-solid fa-bowl-rice"></i>
                <span>Phở <strong>Gia Truyền</strong></span>
            </div>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Tìm kiếm món ăn...">
            </div>
            <button class="cart-btn" id="openCartBtn">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="cart-badge" id="cartBadge">0</span>
            </button>
        </div>
    </header>

    <!-- Banner Quảng Cáo -->
    <section class="hero-banner">
        <div class="hero-content">
            <h1>Hương Vị Phở Việt Đậm Đà</h1>
            <p>Nước dùng hầm từ xương nguyên chất trong 12 giờ - Thơm ngon chuẩn vị truyền thống</p>
        </div>
    </section>

    <!-- Thân trang chính -->
    <main class="main-container">
        <!-- Bộ lọc danh mục -->
        <div class="category-filters">
            <button class="filter-btn active" data-category="all">Tất cả</button>
            <button class="filter-btn" data-category="pho">Phở Truyền Thống</button>
            <button class="filter-btn" data-category="drink">Nước Uống</button>
        </div>

        <!-- Danh sách món ăn -->
        <section class="menu-grid" id="menuGrid">
            <!-- Tự động sinh bởi Javascript -->
        </section>
    </main>

    <!-- Giỏ Hàng (Sidebar) -->
    <div class="cart-overlay" id="cartOverlay"></div>
    <aside class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h3><i class="fa-solid fa-basket-shopping"></i> Giỏ hàng của bạn</h3>
            <button class="close-btn" id="closeCartBtn">&times;</button>
        </div>
        <div class="cart-items" id="cartItemsList">
            <!-- Danh sách món đã thêm -->
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Tổng tiền:</span>
                <strong id="cartTotalAmount">0đ</strong>
            </div>
            <button class="checkout-btn" id="checkoutBtn" disabled>
                <i class="fa-solid fa-paper-plane"></i> Tiến Hành Đặt Món
            </button>
        </div>
    </aside>

    <!-- Thông báo đặt hàng thành công -->
    <div class="modal" id="successModal">
        <div class="modal-content">
            <i class="fa-solid fa-circle-check success-icon"></i>
            <h2>Đặt món thành công!</h2>
            <p>Đơn hàng của bạn đã được gửi xuống bếp. Xin vui lòng chờ trong giây lát!</p>
            <button class="modal-close-btn" id="modalOkBtn">Đóng</button>
        </div>
    </div>

    <!-- File JavaScript -->
    <script src="assets/main.js"></script>
</body>
</html>
