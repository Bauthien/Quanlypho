{% extends "pho_app/admin/shell.html" %}
{% block title %}{{ title }} - Phở Gia Truyền{% endblock %}
{% block admin_content %}
<div class="auth-card" style="max-width:560px;margin:0;">
    <h1>{{ title }}</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {% for field in form %}
        <div class="form-group">
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {{ field.errors }}
        </div>
        {% endfor %}
        <button class="checkout-btn" type="submit">Lưu</button>
    </form>
</div>
{% endblock %}
