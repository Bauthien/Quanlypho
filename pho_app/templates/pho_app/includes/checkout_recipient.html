<div id="deliveryRecipientFields" hidden>
  {% if checkout_addresses %}<div class="form-group"><label for="checkoutAddressId">Địa chỉ đã lưu</label><select class="form-input" name="address_id" id="checkoutAddressId"><option value="">Nhập địa chỉ khác</option>{% for address in checkout_addresses %}<option value="{{ address.pk }}" {% if address.is_default %}selected{% endif %} data-version="{{ address.version }}" data-name="{{ address.recipient_name }}" data-phone="{{ address.phone }}" data-address="{{ address.full_address }}" data-lat="{{ address.latitude|default_if_none:''|stringformat:'s' }}" data-lng="{{ address.longitude|default_if_none:''|stringformat:'s' }}">{{ address.get_label_display }}{% if address.is_default %} (Mặc định){% endif %} · {{ address.full_address }}</option>{% endfor %}</select></div>{% else %}<select name="address_id" id="checkoutAddressId" hidden><option value="">Nhập địa chỉ nhận món</option></select>{% endif %}<input type="hidden" name="address_version" id="checkoutAddressVersion">
  <div class="checkout-fields-two"><div class="form-group"><label for="recipientName">Tên người nhận</label><input class="form-input" id="recipientName" name="recipient_name" maxlength="100" autocomplete="name" value="{{ user.full_name|default:'' }}"></div><div class="form-group"><label for="recipientPhone">Điện thoại</label><input class="form-input" id="recipientPhone" name="recipient_phone" type="tel" maxlength="20" autocomplete="tel" value="{{ user.phone_number|default:'' }}"></div></div>
</div>
