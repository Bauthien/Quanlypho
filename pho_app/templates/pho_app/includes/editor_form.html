<div class="page-heading"><div><span class="eyebrow">CHĂM CHÚT TỪNG MÓN NGON</span><h1>{{ title }}</h1><p>Thông tin rõ ràng, thực đơn thêm trọn vị.</p></div><a class="secondary-btn" href="{% url 'admin_menu' %}">Quay lại thực đơn</a></div>
<form class="panel editor-card" method="post" enctype="multipart/form-data">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<div class="form-group"><label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="muted">*</span>{% endif %}</label>{{ field }}{% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}{{ field.errors }}</div>{% endfor %}<button class="primary-btn" type="submit">{% include 'pho_app/includes/icon.html' with name='check' %} Lưu thay đổi</button></form>
