<div class="form-group{% if wide %} field-wide{% endif %}{% if field.errors %} has-error{% endif %}">
  {% if field.field.widget.input_type == 'checkbox' %}
    <label class="check-row" for="{{ field.id_for_label }}">{{ field }}<span>{{ field.label }}</span></label>
  {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="required-mark" aria-hidden="true"> *</span>{% endif %}</label>
    {{ field }}
  {% endif %}
  {{ field.errors }}{% if field.help_text %}<div class="field-help" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>{% endif %}
</div>
