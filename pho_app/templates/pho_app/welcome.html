{% extends 'pho_app/base.html' %}
{% block title %}Trang chủ · Phở Nhà Mình{% endblock %}
{% block content %}
<section class="welcome">
    <div class="emoji">🍜</div>
    <h1>Xin chào, {{ request.user.full_name|default:request.user.username }}!</h1>
    <p class="muted">Bạn đã đăng nhập thành công vào hệ thống.</p>
    <span class="role-pill">Vai trò: {{ role_name }}</span>
    <p><a class="button" href="{% url 'pho_app:role_home' %}">Vào trang của tôi</a></p>
</section>
{% endblock %}
